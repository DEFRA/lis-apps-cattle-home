name: 'Prerelease'

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    uses: DEFRA/lis-github-actions/.github/workflows/version.yml@0.1.0
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      release-type: prerelease

  validate:
    name: 'Validate'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/node-service-validate.yml@0.1.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      smoke-port: '3000'
      smoke-env: |
        SESSION_CACHE_ENGINE=memory
        CDP_JWT_ISSUER=https://sts.ci.invalid
        CDP_JWT_JWKS_URI=https://sts.ci.invalid/.well-known/jwks.json
        HUB_JWT_SECRET=ci-smoke-test-hub-jwt-secret-at-least-32-characters

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/node-sonar.yml@0.1.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
    secrets: inherit

  create-tag:
    name: 'Tag Validated Commit'
    needs: [get-version, validate, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: DEFRA/lis-github-actions/.github/workflows/tag.yml@0.1.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
